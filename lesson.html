<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>درس – منصة الدروس</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body class="lesson-page">

<header class="site-header">
  <div class="container">
    <div class="brand">
      <a href="index.html" class="back-btn">←</a>
      <div>
        <h1 id="lessonTitle">جارٍ التحميل...</h1>
        <p id="lessonSubtitle"></p>
      </div>
    </div>
    <nav>
      <button onclick="window.print()" class="btn-print">🖨️ طباعة</button>
    </nav>
  </div>
</header>

<nav class="page-tabs">
  <div class="container">
    <button class="tab-btn active" data-page="knowledge">
      <span class="tab-icon">📘</span>
      <span class="tab-label">المعارف</span>
    </button>
    <button class="tab-btn" data-page="documents">
      <span class="tab-icon">🎬</span>
      <span class="tab-label">الوثائق</span>
    </button>
    <button class="tab-btn" data-page="assessment">
      <span class="tab-icon">📝</span>
      <span class="tab-label">التقويم</span>
    </button>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
  </div>
</nav>

<main class="container lesson-main">

  <section class="page active" id="page-knowledge">
    <div class="page-header">
      <h2>📘 المعارف</h2>
      <p>المحتوى العلمي لهذا الدرس</p>
    </div>
    <article class="knowledge-content" id="knowledgeContent"></article>
    <div class="page-nav">
      <button class="btn-primary" onclick="goToPage('documents')">التالي: الوثائق ←</button>
    </div>
  </section>

  <section class="page" id="page-documents">
    <div class="page-header">
      <h2>🎬 الوثائق</h2>
      <p>صور، فيديوهات، ومستندات مساندة</p>
    </div>
    <div class="media-gallery" id="mediaGallery"></div>
    <div class="page-nav">
      <button class="btn-secondary" onclick="goToPage('knowledge')">→ السابق: المعارف</button>
      <button class="btn-primary" onclick="goToPage('assessment')">التالي: التقويم ←</button>
    </div>
  </section>

  <section class="page" id="page-assessment">
    <div class="page-header">
      <h2>📝 التقويم</h2>
      <p>أجب عن الأسئلة ثم أرسل إجاباتك</p>
    </div>
    <div id="quizContainer" class="quiz-container"></div>
    <div class="page-nav">
      <button class="btn-secondary" onclick="goToPage('documents')">→ السابق: الوثائق</button>
      <button class="btn-success" id="submitQuizBtn" onclick="submitQuiz()">✅ إرسال الإجابات</button>
    </div>
  </section>

</main>

<div class="lightbox" id="lightbox" onclick="closeLightbox()">
  <button class="lightbox-close" onclick="closeLightbox(event)">✕</button>
  <div class="lightbox-content" id="lightboxContent"></div>
</div>
   <nav style="display:flex;gap:8px;flex-wrap:wrap">
      <button onclick="shareToClassroom()" class="btn-classroom">📤 Classroom</button>
      <button onclick="openGoogleMeet()" class="btn-meet">🎥 Meet</button>
      <button onclick="window.print()" class="btn-print">🖨️ طباعة</button>
    </nav><script src="assets/app.js"></script>
<script>initLesson();</script>
</body>
</html>
