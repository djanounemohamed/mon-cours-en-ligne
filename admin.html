<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>⚙️ لوحة إدارة الدروس</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<style>
.admin-container{max-width:1300px;margin:30px auto;padding:0 20px}
.admin-grid{display:grid;grid-template-columns:300px 1fr;gap:24px}
.admin-panel{background:#fff;border-radius:16px;padding:22px;box-shadow:0 4px 0 #c9d4e0, 0 8px 24px rgba(0,0,0,0.08)}
.admin-panel h3{color:#0D47A1;margin-bottom:14px;font-size:17px;padding-bottom:10px;border-bottom:2px solid #e0e6ed}
.lesson-list{list-style:none;max-height:600px;overflow-y:auto;padding:0}
.lesson-list li{padding:11px 14px;border-radius:10px;cursor:pointer;margin-bottom:6px;font-size:14px;background:#f8fafc;border:1px solid #e0e6ed;transition:.2s}
.lesson-list li:hover{background:#eef6ff;border-color:#c9dcf0}
.lesson-list li.active{background:linear-gradient(135deg,#1565C0,#0D47A1);color:#fff}
.form-row{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.form-row label{font-weight:700;font-size:13.5px;color:#0D47A1}
.form-row input,.form-row select,.form-row textarea{padding:11px 14px;border:2px solid #e0e6ed;border-radius:10px;font-family:inherit;font-size:14px;width:100%;box-sizing:border-box}
.form-row input:focus,.form-row select:focus,.form-row textarea:focus{outline:none;border-color:#1565C0}
.form-row textarea{resize:vertical;min-height:100px}
.form-2col{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.media-item,.quiz-item{border:1.5px solid #e0e6ed;border-radius:12px;padding:14px;margin-bottom:10px;background:#f8fafc}
.media-item input,.media-item select,.quiz-item input,.quiz-item select,.quiz-item textarea{width:100%;padding:8px 10px;border:1px solid #e0e6ed;border-radius:8px;margin-bottom:8px;font-family:inherit;font-size:13.5px;box-sizing:border-box}
.btn-remove{background:#C62828;color:#fff;border:none;padding:5px 12px;border-radius:8px;font-size:12px;cursor:pointer;font-weight:700}
.btn-mini{background:#1565C0;color:#fff;border:none;padding:9px 18px;border-radius:10px;font-size:13.5px;cursor:pointer;font-weight:700;margin-top:6px}
.btn-mini:hover{background:#0D47A1}
.btn-save{background:#2E7D32;color:#fff;border:none;padding:12px 24px;border-radius:10px;font-size:15px;cursor:pointer;font-weight:700;flex:1}
.btn-save:hover{background:#1B5E20}
.empty-state{text-align:center;padding:60px 20px;color:#607085}
.btn-nav{background:#fff;color:#0D47A1;padding:10px 18px;border-radius:12px;font-weight:700;font-size:14px;border:2px solid #e0e6ed;cursor:pointer;margin-right:6px}
.btn-nav:hover{background:#eef6ff;border-color:#1565C0}
@media(max-width:900px){.admin-grid{grid-template-columns:1fr}.form-2col{grid-template-columns:1fr}}
</style>
</head>
<body style="font-family:'Cairo',sans-serif;background:#eef2f7;margin:0;direction:rtl">

<header style="background:#fff;box-shadow:0 2px 12px rgba(0,0,0,0.08);padding:14px 20px;position:sticky;top:0;z-index:100">
  <div style="max-width:1300px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:14px">
    <div style="display:flex;align-items:center;gap:14px">
      <a href="index.html" style="width:42px;height:42px;border-radius:50%;background:#eef2f7;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;color:#1565C0;text-decoration:none">←</a>
      <div>
        <h1 style="margin:0;font-size:19px;color:#0D47A1">⚙️ لوحة إدارة الدروس</h1>
        <p style="margin:2px 0 0;font-size:12px;color:#607085">إنشاء وتعديل الدروس – تصدير JSON</p>
      </div>
    </div>
    <div>
      <button class="btn-nav" onclick="exportLessons()">⬇️ تصدير JSON</button>
      <label class="btn-nav" style="cursor:pointer;display:inline-block">
        ⬆️ استيراد
        <input type="file" id="importFile" accept=".json" style="display:none">
      </label>
    </div>
  </div>
</header>

<div class="admin-container">
  <div class="admin-grid">
    <aside class="admin-panel">
      <h3>📚 الدروس</h3>
      <button class="btn-mini" style="width:100%;margin-bottom:12px" onclick="newLesson()">➕ درس جديد</button>
      <ul id="lessonList" class="lesson-list"></ul>
    </aside>

    <section class="admin-panel">
      <div id="editorEmpty" class="empty-state">
        <p style="font-size:60px;margin-bottom:10px">📝</p>
        <p>اختر درساً من القائمة أو أنشئ درساً جديداً</p>
      </div>

      <form id="lessonForm" style="display:none" onsubmit="saveLesson(event)">
        <h3>📋 معلومات أساسية</h3>
        <div class="form-2col">
          <div class="form-row">
            <label>عنوان الدرس *</label>
            <input type="text" id="f-title" required>
          </div>
          <div class="form-row">
            <label>المستوى *</label>
            <select id="f-level" required>
              <option value="1AS">1AS – جذع مشترك علوم وتكنولوجيا</option>
              <option value="2AS">2AS – علوم تجريبية + رياضيات</option>
              <option value="2AS-L">2AS – آداب وفلسفة</option>
              <option value="3AS">3AS – علوم تجريبية</option>
            </select>
          </div>
        </div>
        <div class="form-row">
          <label>وصف قصير</label>
          <input type="text" id="f-desc">
        </div>

        <h3 style="color:#0D47A1;border-bottom:2px solid #e0e6ed;padding-bottom:10px">📘 المعارف (HTML مدعوم)</h3>
        <div class="form-row">
          <textarea id="f-knowledge" rows="12" placeholder="<h3>عنوان</h3><p>نص...</p>"></textarea>
        </div>

        <h3 style="color:#0D47A1;border-bottom:2px solid #e0e6ed;padding-bottom:10px">🎬 الوثائق</h3>
        <div id="mediaList"></div>
        <button type="button" class="btn-mini" onclick="addMediaItem()">➕ إضافة وثيقة</button>

        <h3 style="color:#0D47A1;border-bottom:2px solid #e0e6ed;padding-bottom:10px;margin-top:20px">📝 أسئلة التقويم</h3>
        <div id="quizList"></div>
        <button type="button" class="btn-mini" onclick="addQuizQuestion()">➕ إضافة سؤال</button>

        <div style="display:flex;gap:12px;margin-top:26px;padding-top:20px;border-top:2px solid #e0e6ed">
          <button type="submit" class="btn-save">💾 حفظ الدرس</button>
          <button type="button" class="btn-remove" style="padding:12px 20px" onclick="deleteCurrentLesson()">🗑️ حذف</button>
        </div>
      </form>
    </section>
  </div>
</div>

<script>
var lessonsData = [];
var editingIndex = -1;

function $(id){ return document.getElementById(id); }
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function loadLessons(){
  var local = localStorage.getItem('lessons_data');
  if(local){ try{ return JSON.parse(local); }catch(e){ return []; } }
  return [];
}

function persist(){
  localStorage.setItem('lessons_data', JSON.stringify(lessonsData));
}

function renderLessonList(){
  var ul = $('lessonList');
  if(!lessonsData.length){
    ul.innerHTML = '<li style="color:#607085;font-size:13px;text-align:center;padding:20px">لا توجد دروس بعد</li>';
    return;
  }
  ul.innerHTML = lessonsData.map(function(l,i){
    return '<li class="' + (i===editingIndex?'active':'') + '" onclick="editLesson(' + i + ')">' +
      '<div><strong>' + esc(l.title||'بدون عنوان') + '</strong></div>' +
      '<small style="opacity:.7;font-size:11px">' + esc(l.level||'') + '</small>' +
    '</li>';
  }).join('');
}

function newLesson(){
  editingIndex = -1;
  $('editorEmpty').style.display = 'none';
  $('lessonForm').style.display = 'block';
  $('lessonForm').reset();
  $('mediaList').innerHTML = '';
  $('quizList').innerHTML = '';
  $('f-title').focus();
  renderLessonList();
}

function editLesson(i){
  var l = lessonsData[i];
  if(!l) return;
  editingIndex = i;
  $('editorEmpty').style.display = 'none';
  $('lessonForm').style.display = 'block';
  $('f-title').value = l.title || '';
  $('f-level').value = l.level || '1AS';
  $('f-desc').value = l.description || '';
  $('f-knowledge').value = l.knowledge || '';
  $('mediaList').innerHTML = '';
  (l.documents || []).forEach(function(m){ addMediaItem(m); });
  $('quizList').innerHTML = '';
  (l.quiz || []).forEach(function(q){ addQuizQuestion(q); });
  renderLessonList();
}

function addMediaItem(data){
  data = data || {};
  var div = document.createElement('div');
  div.className = 'media-item';
  div.innerHTML =
    '<button type="button" class="btn-remove" style="float:left;margin-bottom:8px" onclick="this.parentElement.remove()">✕ حذف</button>' +
    '<select class="m-type">' +
      '<option value="image"' + (data.type==='image'?' selected':'') + '>🖼️ صورة</option>' +
      '<option value="youtube"' + (data.type==='youtube'?' selected':'') + '>▶️ YouTube</option>' +
      '<option value="video"' + (data.type==='video'?' selected':'') + '>🎬 فيديو</option>' +
      '<option value="pdf"' + (data.type==='pdf'?' selected':'') + '>📄 PDF</option>' +
    '</select>' +
    '<input type="text" class="m-url" placeholder="الرابط" value="' + esc(data.url||'') + '">' +
    '<input type="text" class="m-caption" placeholder="وصف قصير" value="' + esc(data.caption||'') + '">';
  $('mediaList').appendChild(div);
}

function addQuizQuestion(data){
  data = data || {};
  var div = document.createElement('div');
  div.className = 'quiz-item';
  div.innerHTML =
    '<button type="button" class="btn-remove" style="float:left;margin-bottom:8px" onclick="this.parentElement.remove()">✕ حذف</button>' +
    '<select class="q-type">' +
      '<option value="mcq"' + (data.type==='mcq'?' selected':'') + '>اختيار من متعدد</option>' +
      '<option value="text"' + (data.type==='text'?' selected':'') + '>إجابة نصية</option>' +
    '</select>' +
    '<input type="text" class="q-text" placeholder="نص السؤال" value="' + esc(data.question||'') + '">' +
    '<textarea class="q-options" rows="2" placeholder="الخيارات مفصولة بفاصلة">' + esc((data.options||[]).join(', ')) + '</textarea>' +
    '<input type="text" class="q-correct" placeholder="رقم الإجابة (0,1,2..) أو النموذجية" value="' + esc(data.type==='mcq' ? (data.correct!=null?data.correct:'') : (data.answer||'')) + '">';
  $('quizList').appendChild(div);
}

function saveLesson(e){
  if(e) e.preventDefault();
  var documents = Array.prototype.slice.call($('mediaList').querySelectorAll('.media-item')).map(function(it){
    return {
      type: it.querySelector('.m-type').value,
      url: it.querySelector('.m-url').value.trim(),
      caption: it.querySelector('.m-caption').value.trim()
    };
  }).filter(function(m){ return m.url; });

  var quiz = Array.prototype.slice.call($('quizList').querySelectorAll('.quiz-item')).map(function(it){
    var type = it.querySelector('.q-type').value;
    var q = { type: type, question: it.querySelector('.q-text').value.trim() };
    if(type === 'mcq'){
      q.options = it.querySelector('.q-options').value.split(',').map(function(s){return s.trim();}).filter(Boolean);
      q.correct = Number(it.querySelector('.q-correct').value) || 0;
    } else {
      q.answer = it.querySelector('.q-correct').value.trim();
    }
    return q;
  }).filter(function(q){ return q.question; });

  var lesson = {
    id: editingIndex >= 0 ? lessonsData[editingIndex].id : 'lesson-' + Date.now(),
    title: $('f-title').value.trim(),
    level: $('f-level').value,
    description: $('f-desc').value.trim(),
    knowledge: $('f-knowledge').value,
    documents: documents,
    quiz: quiz
  };

  if(editingIndex >= 0) lessonsData[editingIndex] = lesson;
  else lessonsData.push(lesson);

  persist();
  editingIndex = lessonsData.length - 1;
  renderLessonList();
  alert('✅ تم حفظ الدرس محلياً.\n\nالخطوات التالية:\n1) اضغط "تصدير JSON"\n2) انقل الملف إلى data/lessons.json\n3) ارفع إلى GitHub');
}

function deleteCurrentLesson(){
  if(editingIndex < 0) return;
  if(!confirm('حذف هذا الدرس؟')) return;
  lessonsData.splice(editingIndex, 1);
  persist();
  editingIndex = -1;
  $('lessonForm').style.display = 'none';
  $('editorEmpty').style.display = 'block';
  renderLessonList();
}

function exportLessons(){
  var blob = new Blob([JSON.stringify(lessonsData, null, 2)], { type:'application/json' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'lessons.json';
  a.click();
  URL.revokeObjectURL(a.href);
}

$('importFile').addEventListener('change', function(e){
  var file = e.target.files[0];
  if(!file) return;
  var reader = new FileReader();
  reader.onload = function(ev){
    try{
      lessonsData = JSON.parse(ev.target.result);
      persist();
      editingIndex = -1;
      renderLessonList();
      alert('✅ تم استيراد ' + lessonsData.length + ' درساً');
    }catch(err){ alert('❌ ملف غير صالح: ' + err.message); }
  };
  reader.readAsText(file);
});

lessonsData = loadLessons();
renderLessonList();
</script>

</body>
</html>
