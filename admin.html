
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>⚙️ لوحة إدارة الدروس</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<style>
.admin-container{max-width:1300px;margin:30px auto;padding:0 20px}
.admin-grid{display:grid;grid-template-columns:300px 1fr;gap:24px}
.admin-panel{background:#fff;border-radius:16px;padding:22px;box-shadow:0 4px 0 #c9d4e0, 0 8px 24px rgba(0,0,0,0.08)}
.admin-panel h3{color:var(--primary-dark);margin-bottom:14px;font-size:17px;padding-bottom:10px;border-bottom:2px solid var(--border)}
.lesson-list{list-style:none;max-height:600px;overflow-y:auto}
.lesson-list li{padding:11px 14px;border-radius:10px;cursor:pointer;margin-bottom:6px;font-size:14px;background:#f8fafc;border:1px solid var(--border);transition:.2s}
.lesson-list li:hover{background:#eef6ff;border-color:#c9dcf0}
.lesson-list li.active{background:linear-gradient(135deg,#1565C0,#0D47A1);color:#fff}
.form-row{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.form-row label{font-weight:700;font-size:13.5px;color:var(--primary-dark)}
.form-row input,.form-row select,.form-row textarea{padding:11px 14px;border:2px solid var(--border);border-radius:10px;font-family:inherit;font-size:14px;transition:.2s}
.form-row input:focus,.form-row select:focus,.form-row textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(21,101,192,0.1)}
.form-row textarea{resize:vertical;min-height:100px}
.form-2col{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.media-item,.quiz-item{border:1.5px solid var(--border);border-radius:12px;padding:14px;margin-bottom:10px;background:#f8fafc}
.media-item input,.media-item select,.quiz-item input,.quiz-item select,.quiz-item textarea{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:8px;margin-bottom:8px;font-family:inherit;font-size:13.5px}
.btn-remove{background:#C62828;color:#fff;border:none;padding:5px 12px;border-radius:8px;font-size:12px;cursor:pointer;font-weight:700}
.btn-mini{background:var(--primary);color:#fff;border:none;padding:9px 18px;border-radius:10px;font-size:13.5px;cursor:pointer;font-weight:700;margin-top:6px}
.btn-mini:hover{background:var(--primary-dark)}
.upload-btn{background:linear-gradient(135deg,#2E7D32,#1B5E20);color:#fff;border:none;padding:10px 18px;border-radius:10px;font-size:13.5px;cursor:pointer;font-weight:700;display:inline-block}
.empty-state{text-align:center;padding:60px 20px;color:var(--muted)}
@media (max-width:900px){.admin-grid{grid-template-columns:1fr}.form-2col{grid-template-columns:1fr}}
</style>
</head>
<body>

<header class="site-header">
  <div class="container">
    <div class="brand">
      <a href="index.html" class="back-btn">←</a>
      <div>
        <h1>⚙️ لوحة إدارة الدروس</h1>
        <p>إنشاء وتعديل الدروس – تصدير JSON</p>
      </div>
    </div>
    <nav>
      <button class="btn-nav" onclick="exportLessons()">⬇️ تصدير JSON</button>
      <label class="btn-nav" style="cursor:pointer">
        ⬆️ استيراد
        <input type="file" id="importFile" accept=".json" style="display:none">
      </label>
    </nav>
  </div>
</header>

<div class="admin-container">
  <div class="admin-grid">

    <!-- قائمة الدروس -->
    <aside class="admin-panel">
      <h3>📚 الدروس</h3>
      <button class="btn-mini" style="width:100%;margin-bottom:12px" onclick="newLesson()">➕ درس جديد</button>
      <ul id="lessonList" class="lesson-list"></ul>
    </aside>

    <!-- محرر الدرس -->
    <section class="admin-panel">
      <div id="editorEmpty" class="empty-state">
        <p style="font-size:60px;margin-bottom:10px">📝</p>
        <p>اختر درساً من القائمة أو أنشئ درساً جديداً</p>
      </div>

      <form id="lessonForm" style="display:none">
        <h3>📋 معلومات أساسية</h3>
        <div class="form-2col">
          <div class="form-row">
            <label>عنوان الدرس *</label>
            <input type="text" id="f-title" required placeholder="مثال: آليات النمو والتجديد الخلوي">
          </div>
          <div class="form-row">
            <label>المستوى *</label>
            <select id="f-level" required>
              <option value="1AS">1AS – جذع مشترك علوم وتكنولوجيا</option>
              <option value="2AS">2AS – علوم تجريبية + رياضيات</option>
              <option value="2AS-L">2AS – آداب وفلسفة</option>
              <option value="3AS">3AS – علوم تجريبية</option>
            </select>
          </div>
        </div>
        <div class="form-row">
          <label>وصف قصير</label>
          <input type="text" id="f-desc" placeholder="وصف مختصر للدرس">
        </div>

        <h3>📘 المعارف (يدعم HTML)</h3>
        <div class="form-row">
          <textarea id="f-knowledge" rows="12" placeholder="اكتب محتوى الدرس هنا... يمكنك استخدام HTML مثل <h3>، <p>، <ul>، <li>، <blockquote>، <strong>"></textarea>
        </div>

        <h3>🎬 الوثائق</h3>
        <div class="form-row">
          <label>🖼️ ارفع صورة من جهازك</label>
          <input type="file" id="imageUpload" accept="image/*" multiple style="padding:8px">
        </div>
        <div id="mediaList"></div>
        <button type="button" class="btn-mini" onclick="addMediaItem()">➕ إضافة رابط (YouTube / PDF / صورة)</button>

        <h3 style="margin-top:20px">📝 أسئلة التقويم</h3>
        <div id="quizList"></div>
        <button type="button" class="btn-mini" onclick="addQuizQuestion()">➕ إضافة سؤال</button>

        <div style="display:flex;gap:12px;margin-top:26px;padding-top:20px;border-top:2px solid var(--border)">
          <button type="submit" class="btn-primary" style="flex:1">💾 حفظ الدرس</button>
          <button type="button" class="btn-remove" style="padding:12px 20px" onclick="deleteCurrentLesson()">🗑️ حذف</button>
        </div>
      </form>
    </section>

  </div>
</div>

<script src="assets/app.js"></script>
<script>
initAdmin();

// رفع الصور
document.getElementById('imageUpload').addEventListener('change', async (e) => {
  const files = Array.from(e.target.files);
  for(const file of files){
    if(file.size > 1.5 * 1024 * 1024){
      alert('⚠️ الصورة "' + file.name + '" كبيرة جداً (الحد 1.5MB)');
      continue;
    }
    const dataUrl = await fileToDataURL(file);
    addMediaItem({ type:'image', url:dataUrl, caption:file.name });
  }
  e.target.value = '';
});
</script>
</body>
</html>
